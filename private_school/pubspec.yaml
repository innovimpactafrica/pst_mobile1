name: private_school
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1
  equatable: ^2.0.5
  intl: ^0.20.2
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.7
  url_launcher: ^6.1.10
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  pretty_dio_logger: ^1.3.1
  dotted_border: ^2.1.0
  http: ^1.6.0
  flutter_contacts: ^1.1.7+1
  share_plus: ^7.2.2
  firebase_core: ^3.0.0   
  
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_polyline_points: ^2.0.0
  google_places_flutter: ^2.0.9
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
      - assets/icons/
      - assets/translations/
      - assets/images/